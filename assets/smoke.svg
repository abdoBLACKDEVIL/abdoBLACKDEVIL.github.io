<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <filter id="smoke" x="-20%" y="-30%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".004 .009" numOctaves="4" seed="17"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .25  0 0 0 0 .25  0 0 0 0 .25  2.8 0 0 0 -1.05"/>
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <radialGradient id="fade">
      <stop offset="0" stop-color="white" stop-opacity=".85"/>
      <stop offset=".45" stop-color="white" stop-opacity=".6"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="wisps">
      <ellipse cx="400" cy="490" rx="590" ry="220" fill="url(#fade)" transform="rotate(-22 400 490)"/>
      <ellipse cx="1080" cy="360" rx="540" ry="250" fill="url(#fade)" transform="rotate(28 1080 360)"/>
      <ellipse cx="760" cy="680" rx="600" ry="150" fill="url(#fade)"/>
    </mask>
  </defs>
  <rect width="1440" height="900" filter="url(#smoke)" mask="url(#wisps)"/>
</svg>
